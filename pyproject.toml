[project]
name = "dwri"
version = "0.1.0"
description = "Differentially Weighted Reception Importance (DWRI)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "polars>=1.0",
]

[project.urls]
Homepage = "https://github.com/Elypha/dwri"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nlp = [
  "spacy>=3.8",
  "localspelling>=0.94",
  "tqdm>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwri"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
