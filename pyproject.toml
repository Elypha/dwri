[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwri"]

[project]
name = "dwri"
version = "0.1.0"
description = "Differentially Weighted Reception Importance (DWRI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "polars>=1.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.8",
    "localspelling>=0.94",
    "tqdm>=4.0",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Elypha/dwri"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
